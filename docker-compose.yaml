services:
  api:
    build: .
    container_name: imigrei_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5006:8080"
    environment:
      ConnectionStrings__MySql: "Server=mysql_shared;Port=3306;Database=imigrei;User=root;Password=${MYSQL_PASSWORD};Connection Timeout=60;"
      Jwt__SecretKey: ${JWT_SECRET}
      Cors__Origens__0: ${FRONTEND_URL}
    volumes:
      - arquivos:/app/storage/imigrantes
    networks:
      - mysql_shared_net

volumes:
  arquivos:

networks:
  mysql_shared_net:
    external: true